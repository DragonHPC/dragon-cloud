{{- if .Values.backend.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "dragon.fullname" . }}-backend
  labels:
    {{- include "dragon.backendLabels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - create
      - get
      - list
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - get
      - list
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - "networking.k8s.io"
    resources:
      - ingresses
    verbs:
      - get
      - list
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "dragon.fullname" . }}-backend
  labels:
    {{- include "dragon.backendLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "dragon.fullname" . }}-backend
subjects:
  - kind: ServiceAccount
    name: {{ include "dragon.backendServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
