# Default values for dragon.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

sharedMemoryVolume:
  name: dragonshm
  sizeLimit: 256Gi
  mountPath: /dev/shm

python:
  packages:

# Directories added to PYTHONPATH in every pod.
pythonPaths: []

frontend:
  labels: {}

  # This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
  image:
    repository: <your-repository-here>
    tag: <your-tag-here>
    pullPolicy: Always

  # This is for the secretes for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
  imagePullSecrets: []

  workingDir:
  batchName:

  command:
    - /bin/bash
    - "-c"

  args:
    - |
      if [ -f /tmp/requirements.txt ]; then
          python3 -m pip install -r /tmp/requirements.txt;
      fi;
      python3 -m dragon.cli dragon-config add --ucx-runtime-lib=/usr/lib/x86_64-linux-gnu/ --ucx-include=/usr/include --ucx-build-lib=/usr/lib/x86_64-linux-gnu/;
      # Replace with the path to your program; it must exist at this path in the backend pods.
      dragon --telemetry-level=3 /shared/your_script.py;
  env: {}

  ports:
    - containerPort: 8080

  # This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
  serviceAccount:
    # Specifies whether a service account should be created
    create: true
    # Automatically mount a ServiceAccount's API credentials?
    automount: true
    # Annotations to add to the service account
    annotations: {}
    # The name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template
    name: ""

  rbac:
    create: true

  # This is for setting Kubernetes Annotations to a Pod.
  # For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
  podAnnotations: {}

  # This is for setting Kubernetes Labels to a Pod.
  # For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
  podLabels: {}

  podSecurityContext: {}
    # fsGroup: 2000

  securityContext: {}
    # capabilities:
    #   drop:
    #   - ALL
    # readOnlyRootFilesystem: true
    # runAsNonRoot: true
    # runAsUser: 1000

  resources: {}
    # We usually recommend not to specify default resources and to leave this as a conscious
    # choice for the user. This also increases chances charts run on environments with little
    # resources, such as Minikube. If you do want to specify resources, uncomment the following
    # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi

  # This is to setup the liveness and readiness probes more information can be found here:
  # https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
  livenessProbe: {}
  readinessProbe: {}

  # A ReadWriteMany PVC shared by all pods. Mount it at the same path under backend.
  volumes:
    - name: shared
      persistentVolumeClaim:
        claimName: dragon-shared

  # Pods start in <volumeMounts[0]>/<workingDir>/<batchName> if workingDir is set, else in volumeMounts[1] if present.
  volumeMounts:
    - name: shared
      mountPath: /shared

  nodeSelector: {}

  affinity: {}

  tolerations: {}

  jobAnnotations: {}
  jobLabels: {}

  ttlSecondsAfterFinished: 300



backend:
  labels: {}

  nnodes: 1

  image:
    repository: <your-repository-here>
    tag: <your-tag-here>
    pullPolicy: Always

  imagePullSecrets: []

  command:
    - /bin/bash
    - "-c"

  args:
    - |
      if [ -f /tmp/requirements.txt ]; then
          python3 -m pip install -r /tmp/requirements.txt;
      fi;
      python3 -m dragon.cli dragon-config add --ucx-runtime-lib=/usr/lib/x86_64-linux-gnu/ --ucx-include=/usr/include --ucx-build-lib=/usr/lib/x86_64-linux-gnu/;
      dragon-backend;

  env: {}

  ports:
    - containerPort: 8081
    - containerPort: 4242

  serviceAccount:
    create: true
    automount: true
    annotations: {}
    name: ""

  rbac:
    create: true

  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}

  securityContext:
    allowPrivilegeEscalation: true
    capabilities:
      add:
        - IPC_LOCK
        - IPC_OWNER
        - SYS_RESOURCE
    privileged: true
    readOnlyRootFilesystem: false
    runAsNonRoot: false

  resources:
    limits:
      nvidia.com/gpu: 4
    requests:
      nvidia.com/gpu: 4

  livenessProbe: {}
  readinessProbe: {}

  volumes:
    - name: shared
      persistentVolumeClaim:
        claimName: dragon-shared

  volumeMounts:
    - name: shared
      mountPath: /shared

  nodeSelector: {}

  affinity: {}

  topologySpreadConstraints: {}

  tolerations:
    - key: node-role.kubernetes.io/compute
      operator: Exists
      effect: NoExecute
    - key: nvidia.com/gpu.present
      operator: Exists
      effect: NoSchedule

  jobAnnotations: {}
  jobLabels: {}

  ttlSecondsAfterFinished: 300

telemetryService:
  name: telemetry
  type: ClusterIP
  port: 4242
  targetPort: 4242
  protocol: TCP

# The domain name of the endpoint used for the gateway.
domain:
  name: